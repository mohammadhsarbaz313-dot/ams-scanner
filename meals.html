<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت وعده غذایی</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; direction: rtl; background: #111; color: #fff; min-height: 100vh; }
    header { background: #0f4c3a; padding: 14px; text-align: center; }
    .box { padding: 16px; }
    select, button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; margin-bottom: 10px; }
    button { background: #0f4c3a; color: #fff; cursor: pointer; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
    .result { margin: 16px; padding: 18px; border-radius: 16px; text-align: center; display: none; }
    .r-ok { background: #1e5631; } .r-dup { background: #6b5a1e; } .r-error { background: #5c1e1e; }
    .result .name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .result .status { font-size: 14px; margin-bottom: 14px; opacity: .85; }
    .actions button { background: #2e7d4f; }
  </style>
</head>
<body>
  <header><h2>🍽️ ثبت وعدهٔ غذایی</h2></header>

  <div class="box" id="setupBox">
    <input id="sessionInput" placeholder="Session ID" style="width:100%;padding:14px;border-radius:10px;border:none;margin-bottom:10px;">
    <select id="mealSelect">
      <option value="صبحانه">صبحانه</option>
      <option value="ناهار">ناهار</option>
      <option value="شام">شام</option>
    </select>
    <button id="startBtn">📷 شروع اسکن</button>
  </div>

  <div id="reader"></div>
  <div class="result" id="resultBox"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw3trOuFqG1POFItFaTxKO8ElZcjUwkTRKTEzGidAUArVz-oYCYYVEboL8MSs1Ogom5/exec';
    let html5QrCode, isBusy = false, currentMemberId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const autoSession = urlParams.get('session');
    if (autoSession) document.getElementById('sessionInput').value = autoSession;

    document.getElementById('startBtn').addEventListener('click', function () {
      const sid = document.getElementById('sessionInput').value.trim();
      if (!sid) { alert('Session ID را وارد کنید'); return; }
      document.getElementById('setupBox').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScan, () => {});
    });

    function onScan(qrText) {
      if (isBusy) return;
      isBusy = true;
      const mealType = document.getElementById('mealSelect').value;
      callApi('checkMealCard', { qrCode: qrText, mealType: mealType }, function (res) {
        if (!res.success) { showError(res.message); return; }
        showInfo(res.data);
      });
    }

    function callApi(action, extra, cb) {
      const sid = document.getElementById('sessionInput').value.trim();
      const body = Object.assign({ action: action, sessionId: sid }, extra);
      fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
        .then(r => r.json()).then(cb)
        .catch(e => showError('خطای شبکه: ' + e.message));
    }

    function showInfo(data) {
      currentMemberId = data.memberId;
      const box = document.getElementById('resultBox');
      box.style.display = 'block';

      if (data.alreadyReceived) {
        box.className = 'result r-dup';
        box.innerHTML =
          '<div class="name">⚠️ ' + data.memberName + '</div>' +
          '<div class="status">وعدهٔ "' + data.mealType + '" را قبلاً دریافت کرده است.</div>';
        setTimeout(() => { isBusy = false; box.style.display = 'none'; }, 2500);
      } else {
        box.className = 'result r-ok';
        box.innerHTML =
          '<div class="name">' + data.memberName + '</div>' +
          '<div class="status">خانواده: ' + data.familyHeadName + ' | وعده: ' + data.mealType + '</div>' +
          '<div class="actions"><button onclick="confirmMeal()">✅ ثبت دریافت غذا</button></div>';
      }
    }

    function confirmMeal() {
      const mealType = document.getElementById('mealSelect').value;
      callApi('confirmMeal', { memberId: currentMemberId, mealType: mealType }, function (res) {
        alert(res.success ? res.data.message : res.message);
        document.getElementById('resultBox').style.display = 'none';
        isBusy = false;
      });
    }

    function showError(msg) {
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      box.className = 'result r-error';
      box.innerHTML = '<div class="name">⛔ ' + msg + '</div>';
      setTimeout(() => { isBusy = false; box.style.display = 'none'; }, 2000);
    }
  </script>
</body>
</html>
